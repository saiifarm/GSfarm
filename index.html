<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>사이팜 괴산농장 - 메인 컨트롤러</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- MQTT 클라이언트 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <!-- 분리된 공통 스타일시트 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>



    <!-- [1. 로그인 화면] -->
    <div id="login-section" class="login-box">
        <img src="logo.png" alt="사이팜 로고">
        <h2>사이팜 괴산농장</h2>
        
        <input type="text" id="username" placeholder="아이디" autofocus>
        <input type="password" id="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter') checkLogin()">
        <button class="btn-login" onclick="checkLogin()">로그인</button>
        <p id="error-msg" style="color:red; font-size:13px; display:none; margin-top:10px;"></p>
    </div>

    <!-- [2. 로그인 성공 시 메인 컨트롤러 화면] -->
    <div id="main-content" style="display: none;">
        <header class="top-header">
            <img src="saiifarm-logo1-01.png" alt="saiifarm" class="header-logo">
            <div class="header-center">
                <div class="header-title">괴산농장 Main Controller V2.0</div>
                <div class="header-clock" id="top-time">00시 00분 00초</div>
                <div class="mqtt-status-badge">
                    <span id="mqtt-dot" class="mqtt-dot"></span>
                    <span id="mqtt-status-text">MQTT 연결 중...</span>
                </div>
            </div>
            <div class="top-nav-icons">
                <button class="top-nav-btn" id="nav-btn-HOME" onclick="openMenu('HOME')" title="HOME"><img src="icon1-home.png" alt="HOME"></button>
                <button class="top-nav-btn" id="nav-btn-기상예보" onclick="openMenu('기상예보')" title="기상예보"><img src="icon2-wt.png" alt="기상예보"></button>
                <button class="top-nav-btn" id="nav-btn-농장현황" onclick="openMenu('농장현황')" title="농장현황"><img src="icon3-now.png" alt="농장현황"></button>
                <button class="top-nav-btn" id="nav-btn-농장관리" onclick="openMenu('농장관리')" title="농장관리"><img src="icon4-man.png" alt="농장관리"></button>
                <button class="top-nav-btn" id="nav-btn-자동설정" onclick="openMenu('자동설정')" title="자동설정"><img src="icon-set.png" alt="자동설정"></button>
                <button class="top-nav-btn" id="nav-btn-판넬연결" onclick="openMenu('판넬연결')" title="판넬연결"><img src="icon5-auto.png" alt="판넬연결"></button>
                <button class="btn-logout-icon" onclick="logout()" title="로그아웃"><i data-lucide="log-out" size="18"></i></button>
            </div>
        </header>

        <main class="main-hero" id="main-hero-area">
            <div id="content-area"></div>
        </main>
    </div>

    <!-- 페이지별 분리 스크립트 로드 (core.js보다 먼저 로드) -->
    <script src="page-home.js"></script>
    <script src="page-weather.js"></script>
    <script src="page-status.js"></script>
    <script src="page-manage.js"></script>
    <script src="page-auto.js"></script>
    <script src="page-panel.js"></script>

    <!-- 코어 제어 스크립트 (로그인, MQTT 연결, 메뉴 라우팅, 시계) -->
    <script src="core.js"></script>
</body>
</html>
