<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>사이팜 괴산농장 - 메인 컨트롤러</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- MQTT 클라이언트 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <!-- 분리된 공통 스타일시트 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 세로 모드 접속 시 가로 회전 안내 레이어 -->
    <div id="rotate-notice">
        <div class="notice-box">
            <h3>🔄 화면을 가로로 돌려주세요!</h3>
            <p>더 넓고 쾌적한 농장 현황 모니터링을 위해<br>스마트폰의 <b>'자동 회전'</b>을 켜고 가로로 시청해 주세요.</p>
        </div>
    </div>

    <!-- [1. 로그인 화면] -->
    <div id="login-section" class="login-box">
        <img src="logo.png" alt="사이팜 로고">
        <h2>사이팜 괴산농장</h2>
        
        <input type="text" id="username" placeholder="아이디" autofocus>
        <input type="password" id="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter') checkLogin()">
        <button class="btn-login" onclick="checkLogin()">로그인</button>
        <p id="error-msg" style="color:red; font-size:13px; display:none; margin-top:10px;"></p>
    </div>

    <!-- [2. 로그인 성공 시 메인 컨트롤러 화면] -->
    <div id="main-content" style="display: none;">
        <header class="top-header">
            <img src="saiifarm-logo1-01.png" alt="saiifarm" class="header-logo">
            <div class="header-center">
                <div class="header-title">괴산농장 Main Controller V2.0</div>
                <div class="header-clock" id="top-time">00시 00분 00초</div>
                <div class="mqtt-status-badge">
                    <span id="mqtt-dot" class="mqtt-dot"></span>
                    <span id="mqtt-status-text">MQTT 연결 중...</span>
                </div>
            </div>
            <div class="top-nav-icons">
                <button class="top-nav-btn" id="nav-btn-HOME" onclick="openMenu('HOME')" title="HOME"><img src="icon1-home.png" alt="HOME"></button>
                <button class="top-nav-btn" id="nav-btn-기상예보" onclick="openMenu('기상예보')" title="기상예보"><img src="icon2-wt.png" alt="기상예보"></button>
                <button class="top-nav-btn" id="nav-btn-농장현황" onclick="openMenu('농장현황')" title="농장현황"><img src="icon3-now.png" alt="농장현황"></button>
                <button class="top-nav-btn" id="nav-btn-농장관리" onclick="openMenu('농장관리')" title="농장관리"><img src="icon4-man.png" alt="농장관리"></button>
                <button class="top-nav-btn" id="nav-btn-자동설정" onclick="openMenu('자동설정')" title="자동설정"><img src="icon-set.png" alt="자동설정"></button>
                <button class="top-nav-btn" id="nav-btn-판넬연결" onclick="openMenu('판넬연결')" title="판넬연결"><img src="icon5-auto.png" alt="판넬연결"></button>
                <button class="btn-logout-icon" onclick="logout()" title="로그아웃"><i data-lucide="log-out" size="18"></i></button>
            </div>
        </header>

        <main class="main-hero" id="main-hero-area">
            <div id="content-area"></div>
        </main>
    </div>

    <!-- 페이지별 분리 스크립트 로드 -->
    <script src="page-weather.js"></script>
    <script src="page-status.js"></script>
    <script src="page-manage.js"></script>

    <!-- 코어 제어 스크립트 (로그인, MQTT 연결, 메뉴 라우팅, 시계) -->
    <script>
        const WORKER_URL = 'https://sf-gs-weather.definezero.workers.dev';
        let currentMenu = 'HOME';

        // 센서 데이터 저장 객체 (MQTT)
        let sensorData = {
            firstWeatherIcon: '⛅',
            farm_a: { sun: '-', temp: '-', tempMax: '-', tempMin: '-', hum: '-', humMax: '-', humMin: '-', rain: '0', rainAmount: '0.00', soil: '-' },
            farm_b: { temp: '-', tempMax: '-', tempMin: '-', hum: '-', humMax: '-', humMin: '-' },
            house1: { temp: '-', tempMax: '-', tempMin: '-', hum: '-', humMax: '-', humMin: '-' },
            house2: { temp: '-', tempMax: '-', tempMin: '-', hum: '-', humMax: '-', humMin: '-' },
            house3: { temp: '-', tempMax: '-', tempMin: '-', hum: '-', humMax: '-', humMin: '-', soil: '-' }
        };

        let mqttClient = null;

        // MQTT 연결 상태 UI 업데이트
        function updateMqttStatusUI(isConnected, text) {
            const dot = document.getElementById('mqtt-dot');
            const statusText = document.getElementById('mqtt-status-text');
            if (dot && statusText) {
                if (isConnected) {
                    dot.classList.add('connected');
                    statusText.innerText = text || "MQTT 연결됨";
                } else {
                    dot.classList.remove('connected');
                    statusText.innerText = text || "MQTT 연결 끊김";
                }
            }
        }

        // MQTT 초기화 및 자동 재연결 로직
        function initMQTT() {
            if (mqttClient && mqttClient.isConnected && mqttClient.isConnected()) return;

            const clientId = "saiifarm_web_" + Math.random().toString(16).substring(2, 9);
            
            const isSecure = window.location.protocol === 'https:';
            const mqttHost = "broker.mqtt-dashboard.com";
            const mqttPort = isSecure ? 8884 : 8000;
            const mqttPath = "/mqtt";

            console.log("MQTT 연결 시도:", mqttHost, mqttPort, isSecure ? "(WSS 보안)" : "(WS 일반)");
            updateMqttStatusUI(false, "MQTT 연결 중...");

            try {
                mqttClient = new Paho.MQTT.Client(mqttHost, Number(mqttPort), mqttPath, clientId);
            } catch (err) {
                console.error("MQTT 클라이언트 객체 생성 실패:", err);
                mqttClient = null;
                setTimeout(initMQTT, 5000);
                return;
            }

            mqttClient.onConnectionLost = function(responseObject) {
                console.warn("MQTT 연결 끊김:", responseObject.errorMessage);
                updateMqttStatusUI(false, "연결 끊김 (재시도 중)");
                mqttClient = null;
                setTimeout(initMQTT, 5000);
            };

            mqttClient.onMessageArrived = function(message) {
                try {
                    const topic = message.destinationName;
                    const payload = message.payloadString;
                    const parts = payload.split(',').map(item => item.trim());

                    console.log("📥 MQTT 수신 [" + topic + "]:", payload);

                    if (topic === "saiifarm24/farm_o1" && parts.length >= 10) {
                        sensorData.farm_a = {
                            sun: parts[1] || '-',
                            temp: parts[2] || '-',
                            tempMax: parts[3] || '-',
                            tempMin: parts[4] || '-',
                            hum: parts[5] || '-',
                            humMax: parts[6] || '-',
                            humMin: parts[7] || '-',
                            rain: parts[8] || '0',
                            rainAmount: parts[9] || '0.00',
                            soil: parts[10] || '-'
                        };
                    } else if (topic === "saiifarm24/farm_o2" && parts.length >= 7) {
                        sensorData.farm_b = {
                            temp: parts[1] || '-',
                            tempMax: parts[2] || '-',
                            tempMin: parts[3] || '-',
                            hum: parts[4] || '-',
                            humMax: parts[5] || '-',
                            humMin: parts[6] || '-'
                        };
                    } else if (topic === "saiifarm24/house1" && parts.length >= 7) {
                        sensorData.house1 = {
                            temp: parts[1] || '-',
                            tempMax: parts[2] || '-',
                            tempMin: parts[3] || '-',
                            hum: parts[4] || '-',
                            humMax: parts[5] || '-',
                            humMin: parts[6] || '-'
                        };
                    } else if (topic === "saiifarm24/house2" && parts.length >= 7) {
                        sensorData.house2 = {
                            temp: parts[1] || '-',
                            tempMax: parts[2] || '-',
                            tempMin: parts[3] || '-',
                            hum: parts[4] || '-',
                            humMax: parts[5] || '-',
                            humMin: parts[6] || '-'
                        };
                    } else if (topic === "saiifarm24/house3" && parts.length >= 8) {
                        sensorData.house3 = {
                            temp: parts[1] || '-',
                            tempMax: parts[2] || '-',
                            tempMin: parts[3] || '-',
                            hum: parts[4] || '-',
                            humMax: parts[5] || '-',
                            humMin: parts[6] || '-',
                            soil: parts[7] || '-'
                        };
                    }

                    if (currentMenu === '농장현황' && typeof updateStatusDOM === 'function') {
                        updateStatusDOM();
                    }
                    if (typeof updateTopHeaderTemp === 'function') {
                        updateTopHeaderTemp();
                    }

                } catch (e) {
                    console.error("MQTT 메시지 파싱 오류:", e, "Payload:", message.payloadString);
                }
            };

            mqttClient.connect({
                onSuccess: function() {
                    console.log("✅ MQTT 연결 성공!");
                    updateMqttStatusUI(true, "MQTT 연결됨");
                    mqttClient.subscribe("saiifarm24/farm_o1");
                    mqttClient.subscribe("saiifarm24/farm_o2");
                    mqttClient.subscribe("saiifarm24/house1");
                    mqttClient.subscribe("saiifarm24/house2");
                    mqttClient.subscribe("saiifarm24/house3");
                },
                onFailure: function(message) {
                    console.error("❌ MQTT 연결 실패:", message.errorMessage);
                    updateMqttStatusUI(false, "연결 실패 (재시도 중)");
                    mqttClient = null;
                    setTimeout(initMQTT, 5000);
                },
                useSSL: isSecure
            });
        }

        // DOM 값 주입 공통 헬퍼 함수
        function setVal(id, val) {
            const el = document.getElementById(id);
            if (el) el.innerText = val;
        }

        // 로그인 검증
        function checkLogin() {
            const inputId = document.getElementById('username').value.trim();
            const inputPw = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            if (!inputId || !inputPw) {
                errorMsg.innerText = '아이디와 비밀번호를 입력해주세요.';
                errorMsg.style.display = 'block';
                return;
            }

            fetch(WORKER_URL + '/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: inputId, password: inputPw })
            })
            .then(res => res.json().then(data => ({ status: res.status, body: data })))
            .then(res => {
                if (res.status === 200 && res.body.success) {
                    sessionStorage.setItem('isLoggedIn', 'true');
                    showMain();
                } else {
                    errorMsg.innerText = res.body.message || '아이디 또는 비밀번호가 틀렸습니다.';
                    errorMsg.style.display = 'block';
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            })
            .catch(error => {
                console.error('로그인 통신 오류:', error);
                errorMsg.innerText = '서버 통신 중 오류가 발생했습니다.';
                errorMsg.style.display = 'block';
            });
        }

        function showMain() {
            document.getElementById('login-section').style.display = 'none';
            const mainContent = document.getElementById('main-content');
            mainContent.style.display = 'flex';
            initMQTT(); 
            openMenu('HOME');
            lucide.createIcons();
            if (typeof fetchKMAWeather === 'function') fetchKMAWeather();
        }

        function logout() {
            sessionStorage.removeItem('isLoggedIn');
            location.reload();
        }

        function updateNavigationState(menuName) {
            currentMenu = menuName;
            var menus = ['HOME', '기상예보', '농장현황', '농장관리', '자동설정', '판넬연결'];
            menus.forEach(function(name) {
                var topBtn = document.getElementById('nav-btn-' + name);
                if (topBtn) topBtn.disabled = (name === menuName);
            });
        }

        function renderMenuGridHTML() {
            return '                <div class="menu-grid">                    <div class="menu-card" onclick="openMenu('HOME')">                        <img src="icon1-home.png" alt="HOME" class="menu-icon-img">                        <span class="menu-label">HOME</span>                    </div>                    <div class="menu-card" onclick="openMenu('기상예보')">                        <img src="icon2-wt.png" alt="기상예보" class="menu-icon-img">                        <span class="menu-label">기상예보</span>                    </div>                    <div class="menu-card" onclick="openMenu('농장현황')">                        <img src="icon3-now.png" alt="농장현황" class="menu-icon-img">                        <span class="menu-label">농장현황</span>                    </div>                    <div class="menu-card" onclick="openMenu('농장관리')">                        <img src="icon4-man.png" alt="농장관리" class="menu-icon-img">                        <span class="menu-label">농장관리</span>                    </div>                    <div class="menu-card" onclick="openMenu('자동설정')">                        <img src="icon-set.png" alt="자동설정" class="menu-icon-img">                        <span class="menu-label">자동설정</span>                    </div>                    <div class="menu-card" onclick="openMenu('판넬연결')">                        <img src="icon5-auto.png" alt="판넬연결" class="menu-icon-img">                        <span class="menu-label">판넬연결</span>                    </div>                </div>            ';
        }

        function openMenu(menuName) {
            var container = document.getElementById('content-area');
            var heroArea = document.getElementById('main-hero-area');

            if (menuName === 'HOME') {
                heroArea.style.backgroundColor = '#2D6A3F';
                container.innerHTML = '                    <img src="saiifarm-logo1-01.png" alt="saiifarm" class="hero-logo">                    <div class="hero-divider"></div>                    <div class="hero-date-clock" id="hero-full-time">2026년 00월 00일 00시 00분 00초</div>                    ' + renderMenuGridHTML() + '                ';
            } else if (menuName === '기상예보') {
                heroArea.style.backgroundColor = '#2D6A3F';
                renderWeatherPageHTML();
            } else if (menuName === '농장현황') {
                heroArea.style.backgroundColor = '#5cb85c';
                renderStatusPageHTML();
            } else if (menuName === '농장관리') {
                heroArea.style.backgroundColor = '#66a182';
                renderManagePageHTML();
            } else {
                heroArea.style.backgroundColor = '#2D6A3F';
                container.innerHTML = '                    <h2 style="color:#fff;">📌 ' + menuName + '</h2>                    <div class="hero-divider" style="width: 100%;"></div>                    <p style="margin-top: 20px; color:#fff;">해당 화면 기능 개발 중입니다.</p>                ';
            }

            updateNavigationState(menuName);
        }

        // 시계 자동 갱신
        (function startClock() {
            function update() {
                var now = new Date();
                var topTimeString = String(now.getHours()).padStart(2, '0') + '시 ' + String(now.getMinutes()).padStart(2, '0') + '분 ' + String(now.getSeconds()).padStart(2, '0') + '초';
                var heroTimeString = now.getFullYear() + '년 ' + String(now.getMonth() + 1).padStart(2, '0') + '월 ' + String(now.getDate()).padStart(2, '0') + '일 ' + topTimeString;

                setVal('top-time', topTimeString);
                setVal('hero-full-time', heroTimeString);
            }
            update();
            setInterval(update, 1000);
        })();

        window.onload = function() {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                showMain();
            } else {
                lucide.createIcons();
            }
        };
    </script>
</body>
</html>
