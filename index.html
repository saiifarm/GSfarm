<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>괴산 농장 관리 시스템 - 로그인</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f6f8; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #2e7d32; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1b5e20; }
        #main-content { display: none; padding: 20px; }
    </style>
</head>
<body>

    <!-- 1. 로그인 화면 -->
    <div id="login-section" class="login-box">
        <h2>🌱 농장 관리 접속</h2>
        <input type="text" id="username" placeholder="아이디" autofocus>
        <input type="password" id="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter') checkLogin()">
        <button onclick="checkLogin()">로그인</button>
        <p id="error-msg" style="color:red; font-size:13px; display:none; margin-top:10px;">아이디 또는 비밀번호가 틀렸습니다.</p>
    </div>

    <!-- 2. 로그인 성공 시 나타날 농장 관리 메인 화면 -->
    <div id="main-content">
        <h1>Welcome! 괴산 칠성면 농장 관리 시스템</h1>
        <p>여기에 날씨, 제어 시스템, 센서 데이터를 배치합니다.</p>
        <button onclick="logout()" style="width: auto; padding: 8px 15px; background: #d32f2f;">로그아웃</button>
    </div>

    <script>
        // 사용할 아이디와 비밀번호를 여기에 직접 설정하세요.
        const CORRECT_ID = "admin";
        const CORRECT_PW = "farm1234";

        function checkLogin() {
            const inputId = document.getElementById('username').value.trim();
            const inputPw = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            if (inputId === CORRECT_ID && inputPw === CORRECT_PW) {
                // 로그인 성공 시 세션 저장
                sessionStorage.setItem('isLoggedIn', 'true');
                showMain();
            } else {
                // 실패 시 에러 문구 표시
                errorMsg.style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }

        function showMain() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }

        function logout() {
            sessionStorage.removeItem('isLoggedIn');
            location.reload();
        }

        // 페이지 로드 시 기존 로그인 세션 체크 (새로고침해도 유지)
        window.onload = function() {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                showMain();
            }
        };
    </script>
</body>
</html>
