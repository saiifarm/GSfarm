<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사이팜 괴산농장 - 로그인</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f6f8; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        .login-box img { width: 100%; max-width: 240px; height: auto; margin-bottom: 10px; }
        .login-box h2 { font-size: 35px; color: #333; margin: 0 0 0 0; }
        input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #2e7d32; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        button:hover { background: #1b5e20; }
        #main-content { display: none; padding: 20px; text-align: center; }
    </style>
</head>
<body>

    <!-- 1. 로그인 화면 -->
    <div id="login-section" class="login-box">
        <!-- 로고 이미지 -->
        <img src="saiifarm-logo1-s.png" alt="사이팜 로고">
        <h2>사이팜 괴산농장</h2>
        
        <input type="text" id="username" placeholder="아이디" autofocus>
        <input type="password" id="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter') checkLogin()">
        <button onclick="checkLogin()">로그인</button>
        <p id="error-msg" style="color:red; font-size:13px; display:none; margin-top:10px;">아이디 또는 비밀번호가 틀렸습니다.</p>
    </div>

    <!-- 2. 로그인 성공 시 나타날 농장 관리 메인 화면 -->
    <div id="main-content">
        <h1>🌱 사이팜 괴산농장 관리 시스템</h1>
        <p>환영합니다! 이곳에 날씨, 센서 데이터 및 제어 시스템을 배치하세요.</p>
        <button onclick="logout()" style="width: auto; padding: 8px 15px; background: #d32f2f; color: white; border: none; border-radius: 5px; cursor: pointer;">로그아웃</button>
    </div>

    <script>
        // 사용할 아이디와 비밀번호 설정
        const CORRECT_ID = "admin";
        const CORRECT_PW = "farm1234";

        function checkLogin() {
            const inputId = document.getElementById('username').value.trim();
            const inputPw = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            if (inputId === CORRECT_ID && inputPw === CORRECT_PW) {
                sessionStorage.setItem('isLoggedIn', 'true');
                showMain();
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }

        function showMain() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }

        function logout() {
            sessionStorage.removeItem('isLoggedIn');
            location.reload();
        }

        // 페이지 로드 시 기존 로그인 세션 체크
        window.onload = function() {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                showMain();
            }
        };
    </script>
</body>
</html>
