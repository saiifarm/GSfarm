<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>괴산 농장 관리 시스템 - 로그인</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f6f8; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #2e7d32; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1b5e20; }
        #main-content { display: none; } /* 로그인 전에는 숨김 */
    </style>
</head>
<body>

    <!-- 1. 로그인 화면 -->
    <div id="login-section" class="login-box">
        <h2>🌱 농장 관리 접속</h2>
        <input type="text" id="username" placeholder="아이디">
        <input type="password" id="password" placeholder="비밀번호">
        <button onclick="checkLogin()">로그인</button>
        <p id="error-msg" style="color:red; font-size:13px; display:none;">아이디 또는 비밀번호가 틀렸습니다.</p>
    </div>

    <!-- 2. 로그인 성공 시 나타날 농장 관리 메인 화면 -->
    <div id="main-content">
        <h1>Welcome! 괴산 칠성면 농장 관리 시스템</h1>
        <p>여기에 날씨, 제어 시스템, 센서 데이터를 배치합니다.</p>
        <button onclick="logout()">로그아웃</button>
    </div>

    <script>
        // 지정할 ID와 PW (보안을 위해 PW는 SHA-256 해시로 저장)
        const ADMIN_ID = "admin"; 
        // 예시 비밀번호: "farm1234" 의 SHA-256 해시값
        const ADMIN_PW_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"; 

        // 비밀번호를 암호화 변환하는 함수
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkLogin() {
            const id = document.getElementById('username').value;
            const pw = document.getElementById('password').value;
            const pwHash = await sha256(pw);

            if (id === ADMIN_ID && pwHash === ADMIN_PW_HASH) {
                sessionStorage.setItem('isLoggedIn', 'true');
                showMain();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function showMain() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }

        function logout() {
            sessionStorage.removeItem('isLoggedIn');
            location.reload();
        }

        // 페이지 로드 시 기존 로그인 세션 체크
        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            showMain();
        }
    </script>
</body>
</html>
